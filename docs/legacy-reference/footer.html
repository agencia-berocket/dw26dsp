<script>
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("wf-form-Newsletter-x-Hubspot");
    if (!form) return;

    const portalId = "45485180";
    const formId = "38d0e83f-4bcb-4608-979a-7ae27868552d";

    // --- BOT DEFENSE AVANÇADO ---
    const honeypot = form.querySelector("input[name='website_internal_fake_field']");
    const loadTime = Date.now();
    let userInteracted = false;

    // Monitoramento de interação humana
    ["mousemove", "keydown", "touchstart", "click", "scroll"].forEach(evt =>
      document.addEventListener(evt, () => userInteracted = true)
    );

    // Fingerprint leve
    const browserFingerprint = btoa(
      navigator.userAgent +
      screen.width +
      screen.height +
      Intl.DateTimeFormat().resolvedOptions().timeZone
    );

    // Limite por IP (localStorage)
    const ipKey = "form_submit_limit_newsletter";
    const submitHistory = JSON.parse(localStorage.getItem(ipKey) || "[]");
    const now = Date.now();
    const recentSubmits = submitHistory.filter(ts => now - ts < 3600 * 1000); // 1h

    if (recentSubmits.length >= 3) {
      console.warn("SPAM BLOQUEADO → Excesso de envios por IP no último período.");
    }

    // Detecta preenchimento instantâneo
    function detectFastFill() {
      const inputs = form.querySelectorAll("input, textarea");
      for (const input of inputs) {
        if (input.value && (Date.now() - loadTime) < 800) {
          return true;
        }
      }
      return false;
    }

    // Anomalia nos movimentos (bot linear)
    let mouseMovements = 0;
    document.addEventListener("mousemove", () => mouseMovements++);

    // Checksum token simples
    const token = btoa(String(Date.now()) + Math.random());

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      // --- FILTROS CLÁSSICOS ---
      if (honeypot && honeypot.value.trim() !== "") {
        console.warn("SPAM BLOQUEADO → Honeypot preenchido");
        return;
      }

      if ((Date.now() - loadTime) / 1000 < 3) {
        console.warn("SPAM BLOQUEADO → Tempo mínimo não atingido");
        return;
      }

      if (!userInteracted) {
        console.warn("SPAM BLOQUEADO → Nenhuma interação humana detectada");
        return;
      }

      // Bloqueio HTML/links
      const spamPattern = /(http|https|www\.|<|>|script)/i;
      for (const el of form.querySelectorAll("input, textarea")) {
        if (spamPattern.test(el.value)) {
          console.warn("SPAM BLOQUEADO → HTML/links detectados");
          return;
        }
      }

      // --- FILTROS AVANÇADOS ---
      if (detectFastFill()) {
        console.warn("SPAM BLOQUEADO → Preenchimento instantâneo típico de BOT");
        return;
      }

      if (mouseMovements < 4) {
        console.warn("SPAM BLOQUEADO → Padrão de movimento humano insuficiente");
        return;
      }

      if (recentSubmits.length >= 3) {
        console.warn("SPAM BLOQUEADO → Limite por IP atingido");
        return;
      }

      // --- MONTA PAYLOAD ---
      const formData = new FormData(form);
      const fields = [];

      formData.forEach((value, key) => {
        if (key !== "website_internal_fake_field") {
          fields.push({ name: key, value: value });
        }
      });

      // metadados invisíveis contra bots
      fields.push({ name: "_fp", value: browserFingerprint });
      fields.push({ name: "_tk", value: token });
      fields.push({ name: "_mm", value: String(mouseMovements) });

      const payload = { fields };

      // --- ENVIO ---
      try {
        const response = await fetch(
          `https://api.hsforms.com/submissions/v3/integration/submit/${portalId}/${formId}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          }
        );

        if (response.ok) {
          // salva histórico de IP
          submitHistory.push(now);
          localStorage.setItem(ipKey, JSON.stringify(submitHistory));

          document.getElementById("form-status").innerText = "Enviado com sucesso!";
          form.reset();
        } else {
          document.getElementById("form-status").innerText = "Erro ao enviar.";
          console.error(await response.text());
        }
      } catch (error) {
        console.error("Erro ao conectar:", error);
      }
    });
  });
</script>

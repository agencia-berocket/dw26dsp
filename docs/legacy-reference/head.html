<script>
  // BLOQUEIO UNIVERSAL DE SPAM PARA FORMULÁRIOS WEBFLOW → HUBSPOT
  document.addEventListener("DOMContentLoaded", function () {

    const forms = document.querySelectorAll("form");
    if (!forms.length) return;

    // Marca interação humana
    window.userInteracted = false;
    const humanEvents = ["mousemove", "keydown", "click", "touchstart", "scroll"];
    humanEvents.forEach(evt =>
      document.addEventListener(evt, () => window.userInteracted = true)
    );

    forms.forEach(form => {

      // 🔹 1. HONEYPOT INVISÍVEL
      const honey = document.createElement("input");
      honey.type = "text";
      honey.name = "website_internal_fake_field";
      honey.style.display = "none";
      honey.autocomplete = "off";
      form.appendChild(honey);

      // 🔹 2. MARCA TEMPO ENTRE ABERTURA E ENVIO (bots enviam em milissegundos)
      const loadTime = Date.now();

      // 🔹 3. VALIDAÇÃO NO MOMENTO DO ENVIO
      form.addEventListener("submit", function (e) {

        // 1) HONEYPOT — se preenchido = BOT
        if (honey.value.trim() !== "") {
          e.preventDefault();
          console.warn("SPAM BLOQUEADO → Honeypot preenchido.");
          return false;
        }

        // 2) TEMPO MÍNIMO DE INTERAÇÃO (bloqueia bots instantâneos)
        const timeSpent = (Date.now() - loadTime) / 1000;
        if (timeSpent < 3) { // menos de 3 segundos na página = bot
          e.preventDefault();
          console.warn("SPAM BLOQUEADO → Tempo muito curto.");
          return false;
        }

        // 3) CHECA SE HOUVE INTERAÇÃO HUMANA REAL
        if (!window.userInteracted) {
          e.preventDefault();
          console.warn("SPAM BLOQUEADO → Sem interação humana.");
          return false;
        }

        // 4) BLOQUEIO DE LINKS/HTML NOS CAMPOS
        const spamPattern = /(http|https|www\.|<|>|script)/i;

        ["firstname", "lastname", "name", "message", "comments"].forEach(field => {
          const element = form.querySelector(`[name='${field}']`);
          if (element && spamPattern.test(element.value)) {
            e.preventDefault();
            alert("Conteúdo inválido detectado.");
            console.warn("SPAM BLOQUEADO → Link ou HTML no campo: " + field);
            return false;
          }
        });
      });
    });
  });
</script>
